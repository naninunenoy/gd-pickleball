name: Web export

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot editor and web templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/opt/godot
            ~/.local/share/godot/export_templates
          key: godot-4.7.2-stable-linux-web-nothreads

      - name: Install Godot 4.7.2 and web export templates
        run: ./scripts/install_godot.sh

      - name: Export WASM build
        run: ./scripts/export_web.sh

      - name: Upload export artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: build/web
          if-no-files-found: error

      - name: Prepare GitHub Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
